name: Build Native Android APK (Linella Order PRO)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android Project & Compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: 4. Generate Android Project & Offline Intelligence Engine via Python
        shell: python
        run: |
          import os
          import urllib.request

          os.makedirs("app/src/main/java/md/linella/orderpro", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          # 1. Скачиваем библиотеку SheetJS (XLSX) внутрь APK для полной офлайн-работы
          urllib.request.urlretrieve(
              "https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js",
              "app/src/main/assets/xlsx.full.min.js"
          )

          # 2. settings.gradle
          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LinellaOrderPRO"
          include ':app'
          ''')

          # 3. build.gradle
          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ''')

          # 4. gradle.properties
          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write('''org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')

          # 5. app/build.gradle
          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'md.linella.orderpro'
              compileSdk 34

              defaultConfig {
                  applicationId "md.linella.orderpro"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0-PRO"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          ''')

          # 6. AndroidManifest.xml
          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:label="Linella Order PRO"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          # 7. MainActivity.java (с поддержкой выбора нескольких Excel-файлов на телефоне)
          with open("app/src/main/java/md/linella/orderpro/MainActivity.java", "w", encoding="utf-8") as f:
              f.write('''package md.linella.orderpro;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private final static int FILECHOOSER_RESULTCODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
